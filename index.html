<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacitación ARES – Seguridad Repremundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Capacitación interactiva ARES: escenario 16:9 escalado, mascota a la derecha, subtítulos y controles debajo. */
:root{
  --ground:#EEF3F8; --navy:#1C2E4F; --ink:#14202E; --accent:#EE7A1E; --paper:#FAFCFE; --line:#D5DEE9;
  --muted:#5B6B80; --ok:#1F8A5B; --bad:#C2412D;
  --wall:color-mix(in srgb, var(--ground) 86%, var(--navy)); --floor:color-mix(in srgb, var(--ground) 78%, var(--navy));
  --frame:color-mix(in srgb, var(--navy) 70%, var(--ink)); --mon:color-mix(in srgb, var(--navy) 88%, var(--ground));
  --monlit:color-mix(in srgb, var(--navy) 45%, var(--ground)); --glow:color-mix(in srgb, var(--accent) 30%, transparent);
  --card1:color-mix(in srgb, var(--accent) 42%, var(--ground)); --card2:color-mix(in srgb, var(--accent) 62%, var(--navy));
  --font:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;align-items:center}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{width:100%;max-width:1280px;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
/* barra superior */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-size:13px;letter-spacing:.14em;color:var(--accent);font-weight:900}
.brand span{font-size:20px;font-weight:900;color:var(--navy)}
.tbtn{border:1.5px solid var(--line);background:var(--paper);color:var(--navy);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:800}
.tbtn:hover{border-color:var(--navy)}
.prog{display:flex;gap:4px;width:100%}
.prog button{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);padding:0}
.prog button.done{background:color-mix(in srgb, var(--navy) 55%, var(--ground))}
.prog button.cur{background:var(--accent)}
/* escenario */
.stagewrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--ground);box-shadow:0 10px 30px rgba(20,32,46,.12)}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden}
.scene{position:absolute;inset:0}
.layer{position:absolute;inset:0}
.art{position:absolute;inset:0;width:100%;height:100%}
/* subtítulos y controles */
.caption{min-height:84px;background:var(--navy);color:#fff;border-radius:14px;padding:14px 20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(17px,2.1vw,24px);font-weight:700;line-height:1.35;border-top:5px solid var(--accent)}
.caption p{margin:0;max-width:62ch;transition:opacity .25s}
.ctrls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.cbtn{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:800;background:var(--paper);color:var(--navy);box-shadow:0 2px 0 var(--line)}
.cbtn.main{background:var(--accent);color:#fff;min-width:150px}
.cbtn:disabled{opacity:.4;cursor:default}
.cbtn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--glow)}}
.auto{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--muted)}
.auto input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);text-align:center}
/* piezas del escenario */
.kicker{font-size:26px;font-weight:900;letter-spacing:.14em;color:var(--accent);margin:0}
.h{font-size:72px;line-height:1.05;font-weight:900;color:var(--navy);margin:0;text-wrap:balance}
.words{position:absolute;display:flex;flex-direction:column;gap:12px}
.card{position:absolute;background:var(--paper);border-radius:26px;box-shadow:0 16px 36px rgba(20,32,46,.12)}
.chip{position:absolute;padding:12px 24px 12px 20px;border-radius:40px;background:var(--paper);color:var(--navy);font-size:30px;font-weight:800;line-height:1.2;box-shadow:0 10px 26px rgba(20,32,46,.16);max-width:520px;display:flex;align-items:center;gap:12px}
.dot{flex:none;width:15px;height:15px;border-radius:50%;background:var(--accent)}
.hl{position:absolute;pointer-events:none;border:5px solid var(--accent);border-radius:16px;box-shadow:0 0 0 9px var(--glow)}
.fx{opacity:0;transform:translateY(22px);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.9,.3,1.3)}
.fx.l{transform:translateX(-36px)}
.fx.in{opacity:1;transform:none}
.dim{opacity:.5!important}
.phone{position:absolute;background:var(--ink);border-radius:54px;padding:14px;box-shadow:0 36px 70px rgba(20,32,46,.25)}
.screen{position:relative;overflow:hidden;border-radius:40px;background:#fff}
.roll{position:absolute;left:0;top:0;transition:transform .9s cubic-bezier(.45,0,.2,1)}
.roll img,.shot img{display:block}
.shot{position:absolute;filter:drop-shadow(0 26px 36px rgba(20,32,46,.22))}
/* mascota */
.mascot{position:absolute;left:1340px;bottom:-40px;width:0;height:0}
.mbody{position:absolute;left:0;bottom:0;animation:bob 3.2s ease-in-out infinite;transform-origin:0 100%}
.mbody img{position:absolute;bottom:0;left:0;transform:translateX(-50%) scale(.97);opacity:0;transition:opacity .3s ease,transform .35s cubic-bezier(.2,.9,.3,1.4)}
.mbody img.on{opacity:1;transform:translateX(-50%) scale(1)}
.mshadow{position:absolute;left:-220px;width:440px;bottom:-24px;height:56px;border-radius:50%;background:radial-gradient(closest-side, rgba(0,0,0,.16), transparent)}
.mascot.waving .mbody{animation:wave .6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(.6deg)}}
@keyframes wave{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
.lift{animation:lift 9s ease-in-out infinite}
@keyframes lift{0%{transform:translate(500px,382px)}38%,50%{transform:translate(728px,382px)}92%,100%{transform:translate(500px,382px)}}
.load{animation:load 9s step-end infinite}
@keyframes load{0%{opacity:1}42%{opacity:0}93%{opacity:1}}
.newbox{animation:newbox 9s step-end infinite}
@keyframes newbox{0%{opacity:0}42%{opacity:1}93%{opacity:0}}
.rec{animation:rec 2s ease-in-out infinite}
@keyframes rec{50%{opacity:.3}}
.conf{position:absolute;top:-30px;width:16px;height:10px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(980px) rotate(540deg)}}
/* menú y cuestionario */
.view{position:absolute;inset:0}
.menu-btns{position:absolute;left:96px;top:470px;display:flex;flex-direction:column;gap:16px;width:760px}
.big{border:0;border-radius:20px;background:var(--accent);color:#fff;font-size:36px;font-weight:900;padding:22px 34px;text-align:left;box-shadow:0 10px 24px var(--glow)}
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mod{border:2px solid var(--line);border-radius:18px;background:var(--paper);color:var(--navy);font-size:26px;font-weight:800;padding:16px 20px;text-align:left;display:flex;gap:14px;align-items:center}
.mod:hover,.opt:hover:not(:disabled){border-color:var(--navy)}
.mod i{font-style:normal;flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.quiz{position:absolute;left:80px;top:60px;width:1040px}
.qnum{font-size:24px;font-weight:900;letter-spacing:.12em;color:var(--accent)}
.qtext{font-size:40px;font-weight:900;color:var(--navy);line-height:1.15;margin:12px 0 26px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{border:2.5px solid var(--line);background:var(--paper);border-radius:18px;padding:12px 22px;font-size:26px;font-weight:700;color:var(--ink);text-align:left;display:flex;gap:16px;align-items:center}
.opt b{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ground);color:var(--navy);display:flex;align-items:center;justify-content:center}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb, var(--ok) 10%, var(--paper))}
.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 8%, var(--paper))}
.opt.bad b{background:var(--bad);color:#fff}
.feedback{margin-top:18px;font-size:24px;font-weight:700;color:var(--ink);line-height:1.3;min-height:74px}
.feedback strong{color:var(--navy)}
.score{font-size:180px;font-weight:900;color:var(--navy);line-height:1}
/* evaluación fuera del escenario (se adapta al celular) */
body.quizmode .stagewrap, body.quizmode .caption, body.quizmode .ctrls, body.quizmode .hint, body.quizmode .prog{display:none}
.qpanel{background:var(--paper);border-radius:18px;box-shadow:0 10px 30px rgba(20,32,46,.12);padding:clamp(18px,4vw,40px);display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:28px;align-items:start}
.qpanel[hidden]{display:none}
.qmasc img{width:100%;display:block}
.qpanel .qnum{font-size:14px}
.qpanel .qtext{font-size:clamp(21px,3vw,30px);margin:8px 0 20px}
.qpanel .opts{gap:10px}
.qpanel .opt{font-size:clamp(16px,2.1vw,19px);padding:12px 16px;border-width:2px;border-radius:14px}
.qpanel .opt b{width:32px;height:32px;font-size:15px}
.qpanel .feedback{font-size:17px;min-height:0;margin-top:16px}
.qpanel .score{font-size:clamp(60px,10vw,104px)}
.qpanel .big{font-size:18px;padding:14px 22px;border-radius:14px;box-shadow:none}
.qpanel .big.sec{background:var(--navy)}
.qpanel .big.ghost{background:var(--ground);color:var(--navy)}
.qact{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.reg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;gap:6px}
.field.wide,.consent,.reg .err,.reg .qact{grid-column:1/-1}
.field label{font-size:15px;font-weight:800;color:var(--navy)}
.field input,.field select{font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.field input:focus,.field select:focus{outline:3px solid var(--glow);border-color:var(--accent)}
.field input[aria-invalid="true"],.field select[aria-invalid="true"]{border-color:var(--bad)}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--muted);background:var(--ground);padding:12px 14px;border-radius:12px}
.consent input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}
.err{margin:0;color:var(--bad);font-weight:700;font-size:15px;min-height:1em}
.who{font-size:15px;color:var(--muted);margin:0 0 4px}
.status{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px;font-weight:700;background:var(--ground);color:var(--navy)}
.status.ok{background:color-mix(in srgb, var(--ok) 12%, var(--paper));color:var(--ok)}
.status.bad{background:color-mix(in srgb, var(--bad) 10%, var(--paper));color:var(--bad)}
@media (max-width:720px){.qpanel{grid-template-columns:1fr}.qmasc{display:none}.reg{grid-template-columns:1fr}}
/* aviso para girar el celular */
.rotate{position:fixed;inset:0;z-index:30;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center}
.rotate[hidden]{display:none}
.rotate img{height:30vh;max-height:240px}
.rotate h2{margin:0;font-size:28px;font-weight:900}
.rotate p{margin:0;font-size:17px;line-height:1.45;max-width:30ch;color:color-mix(in srgb,#fff 82%,var(--navy))}
.rotate .ph{width:46px;height:78px;border:4px solid #fff;border-radius:10px;position:relative;animation:turn 2.4s ease-in-out infinite}
.rotate .ph::after{content:"";position:absolute;left:50%;bottom:5px;width:10px;height:3px;margin-left:-5px;border-radius:2px;background:#fff}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
.rotate button{border:0;border-radius:14px;font:inherit;font-size:17px;font-weight:800;padding:14px 22px;width:min(320px,100%)}
.rotate .r1{background:var(--accent);color:#fff}
.rotate .r2{background:transparent;color:#fff;border:2px solid color-mix(in srgb,#fff 50%,transparent)}
.only-ls{display:none}
/* celular en horizontal: escenario a toda altura, subtítulos y controles en columna lateral */
@media (orientation:landscape) and (max-height:540px){
  .app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 220px;grid-template-rows:1fr auto;gap:8px;padding:6px 8px;height:100%}
  .top,.prog,.hint{display:none}
  .stagewrap{grid-column:1;grid-row:1 / span 2;align-self:center;justify-self:center;width:min(100%, calc((100dvh - 12px) * 16 / 9));border-radius:10px}
  .caption{grid-column:2;grid-row:1;font-size:15px;padding:10px 12px;min-height:0;align-self:stretch;border-radius:10px;border-top-width:4px}
  .ctrls{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .cbtn{padding:8px 6px;font-size:13px;border-radius:9px}
  .cbtn.main{min-width:0;grid-column:1 / span 2}
  .auto{grid-column:1 / span 2;font-size:12px;justify-content:center}
  .only-ls{display:block}
  body.quizmode .app{display:flex;height:auto}
}
@media (prefers-reduced-motion: reduce){.mbody,.lift,.load,.newbox,.rec,.conf,.cbtn.pulse{animation:none!important}.fx,.roll,.mbody img{transition:none!important}}
@media (max-width:640px){.cbtn{padding:10px 12px;font-size:14px}.cbtn.main{min-width:110px}.brand span{font-size:17px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><b>SEGURIDAD REPREMUNDO</b><span id="modname">Capacitación ARES</span></div>
    <button class="tbtn" id="bHome" type="button">Inicio</button>
    <button class="tbtn" id="bQuiz" type="button">Evaluación</button>
  </div>
  <div class="prog" id="prog" aria-label="Avance por bloques"></div>
  <div class="stagewrap" id="wrap"><div class="stage" id="stage"></div></div>
  <div class="caption" aria-live="polite"><p id="cap">Bienvenido. Pulse «Comenzar capacitación» para iniciar con la voz del instructor.</p></div>
  <div class="ctrls">
    <button class="cbtn" id="bPrev" type="button">◀ Anterior</button>
    <button class="cbtn main" id="bPlay" type="button">▶ Reproducir</button>
    <button class="cbtn" id="bAgain" type="button">↺ Repetir</button>
    <button class="cbtn" id="bNext" type="button">Siguiente ▶</button>
    <button class="cbtn only-ls" id="bHome2" type="button">⌂ Inicio</button><button class="cbtn only-ls" id="bFull2" type="button" hidden>⛶ Completa</button>
    <label class="auto"><input type="checkbox" id="auto" checked> Avanzar solo</label>
  </div>
  <div class="hint">En el celular, gírelo en horizontal para ver mejor las pantallas.</div>
  <section class="qpanel" id="qpanel" hidden aria-live="polite"></section>
</div>
<div class="rotate" id="rotate" hidden role="dialog" aria-labelledby="rotT"><img id="rotImg" alt=""><div class="ph" aria-hidden="true"></div><h2 id="rotT">Gire su celular</h2><p>La capacitación se ve mejor en horizontal. Gire el celular para verla en grande.</p><button class="r1" type="button" id="rFull" hidden>Ver en pantalla completa</button><button class="r2" type="button" id="rStay">Continuar en vertical</button></div>

<audio id="voz" preload="auto"></audio>

<script>
/* =========================================================
   CONFIGURACIÓN EDITABLE
   bloques[].lineas: [segundo de diseño, texto del subtítulo, audio]
     - audio: archivo de la carpeta assets/voz con esa frase. null = sin voz (el subtítulo se muestra el tiempo de lectura).
     - El segundo de diseño solo ordena las animaciones dentro del bloque; la voz marca el ritmo real.
   pose: poses de la mascota [segundo de diseño, pose].
   ========================================================= */
const CONFIG = {
  bloques: [
    { id:'bienvenida', modulo:'Bienvenida', dur:13,
      lineas:[[0,'¡Hola! Bienvenido a esta capacitación.','assets/voz/01a-hola.mp3'],[4.4,'En esta oportunidad vamos a conocer algunos de los procedimientos que hacen parte de nuestras actividades de monitoreo y control.','assets/voz/01b-oportunidad.mp3']],
      pose:[[0,'wave'],[5.3,'present']], wave:[0,4.6] },
    { id:'recorrido', modulo:'Bienvenida', dur:16,
      lineas:[[0,'Te acompañaré durante este recorrido para explicarte cómo se deben gestionar los cargues y descargues, el registro de novedades y las aperturas de cuartos de seguridad y racks.','assets/voz/02a-acompanare.mp3'],[11,'¡Comencemos!','assets/voz/02b-comencemos.mp3']],
      pose:[[0,'present'],[3,'point'],[5.5,'present'],[10.9,'cheer']] },
    { id:'ares', modulo:'La plataforma ARES', dur:13,
      lineas:[[0,'Ingresa a ARES y abre el menú. En la sección Ares encontrarás los tres registros:','assets/voz/03a-menu.mp3'],[6.8,'Operaciones de cargue y descargue, Novedades, y Apertura y cierre de lugares con mercancía delicada.','assets/voz/03b-registros.mp3']],
      pose:[[0,'present'],[11.6,'thumbs']] },
    { id:'muelle', modulo:'Módulo 1 · Cargues y descargues', dur:4.7,
      lineas:[[0,'Comenzamos con nuestro primer módulo: cargues y descargues.','assets/voz/04a-modulo1.mp3']],
      pose:[[0,'wave'],[1.8,'present']], wave:[0,1.7] },
    { id:'registroCargue', modulo:'Módulo 1 · Cargues y descargues', dur:24,
      lineas:[[0,'En ARES, abre Operaciones de cargue y descargue y diligencia los datos de la operación.','assets/voz/06a-formulario.mp3'],[5.6,'Placa, bodega, cliente, tipo de operación (cargue o descargue), muelle, conductor, cédula, destino y responsable.','assets/voz/06b-campos.mp3'],[13.6,'Si la operación trae novedad, márcala, elige el tipo y agrega observaciones.','assets/voz/06c-novedad.mp3'],[18.4,'Adjunta al menos una foto como evidencia y pulsa Registrar cargue.','assets/voz/06d-evidencia.mp3']],
      pose:[[0,'present'],[18.4,'idea'],[21.4,'thumbs']] },
    { id:'recuerda', modulo:'Módulo 1 · Cargues y descargues', dur:11,
      lineas:[[0,'Recuerda: toda novedad identificada debe quedar debidamente documentada, indicando la fecha, la hora, el lugar y una descripción clara de lo observado.','assets/voz/07-recuerda.mp3']],
      pose:[[0,'idea'],[8.6,'point']] },
    { id:'novedades', modulo:'Módulo 2 · Novedades', dur:18,
      lineas:[[0,'Ahora continuamos con el módulo de novedades.','assets/voz/08a-modulo2.mp3'],[4.2,'Una novedad es cualquier situación relevante identificada durante las actividades de monitoreo que requiere ser documentada o comunicada.','assets/voz/08b-definicion.mp3'],[11.4,'Cuando identifiques una situación, es importante registrar la información de manera clara, objetiva y precisa.','assets/voz/08c-clara.mp3']],
      pose:[[0,'wave'],[3.6,'calm'],[11.4,'present']], wave:[0,3.3] },
    { id:'pasos', modulo:'Módulo 2 · Novedades', dur:26,
      lineas:[[0,'Ten en cuenta estos aspectos:','assets/voz/09a-aspectos.mp3'],[3,'Primero, identifica qué ocurrió.','assets/voz/09b-primero.mp3'],[6.2,'Segundo, establece la fecha y hora del evento.','assets/voz/09c-segundo.mp3'],[9.6,'Tercero, identifica el lugar o área donde se presentó.','assets/voz/09d-tercero.mp3'],[13.2,'Cuarto, describe los hechos de acuerdo con lo que realmente se observa.','assets/voz/09e-cuarto.mp3'],[17.6,'Y finalmente, realiza el registro y la comunicación correspondiente según el procedimiento establecido.','assets/voz/09f-finalmente.mp3'],[22.8,'Repaso de los 5 pasos.','assets/voz/09g-repaso.mp3']],
      pose:[[0,'present'],[3,'point'],[9.6,'present'],[13.2,'think'],[17.6,'present'],[22.8,'thumbs']] },
    { id:'registroNovedad', modulo:'Módulo 2 · Novedades', dur:18,
      lineas:[[0,'En ARES, abre Novedades y selecciona la sede. La unidad de seguridad aparece asignada.',null],[6.2,'Elige el tipo de novedad y describe lo ocurrido.','assets/voz/10b-tipo.mp3'],[10.2,'Adjunta al menos una imagen como evidencia (máximo 10) y envía la novedad.','assets/voz/10c-evidencias.mp3']],
      pose:[[0,'present'],[10.4,'idea'],[15,'thumbs']] },
    { id:'hechos', modulo:'Módulo 2 · Novedades', dur:11,
      lineas:[[0,'Recuerda que nuestros reportes deben basarse en hechos observables, evitando suposiciones o conclusiones que no puedan ser verificadas.','assets/voz/11-hechos.mp3']],

/* ---------- estado y reproducción ---------- */
let idx = -1, update = null, playing = false, view = 'menu';
let li = 0, lineAcc = 0, lineT0 = 0, lineAudio = false;
const prog = $('prog');

/* ---------- voz: cada frase tiene su propio audio; la frase marca el ritmo de las animaciones ---------- */
const DUR = CONFIG.duraciones || {};
const words = (s) => s.split(/\s+/).length;
function lineLen(b, k) {
  const l = b.lineas[k];
  if (l[2]) return DUR[l[2]] || (lineAudio && li === k && isFinite(voz.duration) ? voz.duration : 1 + 0.4 * words(l[1]));
  return Math.max(2.5, 1.2 + 0.33 * words(l[1])); // sin voz: tiempo de lectura
}
function elapsed() {
  if (lineAudio) return voz.currentTime || 0;
  return lineAcc + (playing ? (performance.now() - lineT0) / 1000 : 0);
}
function designT() {
  const b = B[idx], L = b.lineas;
  const len = lineLen(b, li), e = Math.min(len, elapsed());
  const a = L[li][0], z = li + 1 < L.length ? L[li + 1][0] : b.dur;
  return { t: a + (z - a) * (len ? e / len : 1), e, len };
}
function loadLine(k) {
  const b = B[idx]; li = k; lineAcc = 0; lineT0 = performance.now();
  const a = b.lineas[k][2];
  lineAudio = !!a;
  voz.pause();
  if (a) { voz.src = src(a); try { voz.currentTime = 0; } catch (e) {} }
  capEl.textContent = b.lineas[k][1];
}
function nextLine() {
  const b = B[idx];
  if (li + 1 < b.lineas.length) { loadLine(li + 1); if (playing) startLine(); }
  else endBlock();
}
function startLine() {
  lineT0 = performance.now();
  if (lineAudio) {
    const p = voz.play();
    if (p && p.catch) p.catch(() => { lineAudio = false; lineAcc = 0; lineT0 = performance.now(); }); // sin permiso de audio: sigue con el tiempo de lectura
  }
}
voz.addEventListener('ended', () => { if (view === 'block' && playing && lineAudio) nextLine(); });
function render() {
  if (view === 'block' && idx >= 0) {
    const b = B[idx], { t, e, len } = designT();
    update && update(t);
    let pose = b.pose[0][1]; b.pose.forEach((p) => { if (t >= p[0]) pose = p[1]; });
    setPose(pose);
    mascot.classList.toggle('waving', !!(b.wave && t >= b.wave[0] && t < b.wave[1] && playing));
    if (playing && !lineAudio && e >= len) nextLine();
  }
  requestAnimationFrame(render);
}
function endBlock() {
  pause(); li = B[idx].lineas.length - 1; lineAudio = false; lineAcc = lineLen(B[idx], li);
  if ($('auto').checked && idx < B.length - 1) setTimeout(() => go(idx + 1, true), 500);
  else $('bNext').classList.add('pulse');
}
function play() {
  if (view !== 'block') return;
  const b = B[idx];
  if (li === b.lineas.length - 1 && elapsed() >= lineLen(b, li) - 0.05) loadLine(0);
  playing = true; $('bPlay').textContent = '❚❚ Pausa';
  if (lineAudio) { const p = voz.play(); if (p && p.catch) p.catch(() => { lineAudio = false; lineT0 = performance.now(); }); }
  else lineT0 = performance.now();
}
function pause() {
  if (playing && !lineAudio) lineAcc += (performance.now() - lineT0) / 1000;
  playing = false; voz.pause(); $('bPlay').textContent = '▶ Reproducir';
}
function go(i, autoplay) {
  closeQuiz(); pause(); view = 'block'; idx = i; $('bNext').classList.remove('pulse');
  stage.innerHTML = '';
  const sc = H('<div class="scene"></div>'); stage.append(sc);
  update = SCENES[B[i].id](sc);
  stage.append(mascot); curPose = '';
  loadLine(0);
  $('modname').textContent = B[i].modulo;
  [...prog.children].forEach((d, k) => { d.className = k < i ? 'done' : (k === i ? 'cur' : ''); });
  $('bPrev').disabled = i === 0; $('bNext').disabled = false; $('bPlay').disabled = false; $('bAgain').disabled = false;
  if (autoplay) { playing = true; $('bPlay').textContent = '❚❚ Pausa'; startLine(); }
}

    '<div class="qact"><button class="big" type="submit">Empezar evaluación ▶</button><button class="big ghost" type="button" id="rBack">Volver al inicio</button></div></form>', 'present');
  const f = $('regForm');
  $('rBack').addEventListener('click', showMenu);
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = (id) => $(id).value.trim();
    const nombre = v('rNombre').replace(/\s+/g, ' '), cedula = v('rCedula').replace(/[.\s-]/g, '');
    const checks = [['rNombre', nombre.length >= 5 && nombre.includes(' '), 'Escriba su nombre completo (nombre y apellido).'],
      ['rCedula', /^\d{5,11}$/.test(cedula), 'La cédula debe tener solo números (entre 5 y 11 dígitos).'],
      ['rSede', !!v('rSede'), 'Seleccione la sede.'], ['rCargo', !!v('rCargo'), 'Seleccione el cargo.'], ['rTurno', !!v('rTurno'), 'Seleccione el turno.']];
    let msg = '';
    checks.forEach(([id, ok, m]) => { $(id).setAttribute('aria-invalid', String(!ok)); if (!ok && !msg) msg = m; });
    if (!msg && !$('rOk').checked) msg = 'Debe aceptar la autorización de tratamiento de datos para continuar.';
    $('rErr').textContent = msg;
    if (msg) { const bad = checks.find((c) => !c[1]); if (bad) $(bad[0]).focus(); return; }
    persona = { nombre, cedula, sede: v('rSede'), cargo: v('rCargo'), turno: v('rTurno') };
    intento = 0;
    startQuiz();
  });
  $('rNombre').focus();
}

function startQuiz() { qi = 0; score = 0; resp = []; qStart = Date.now(); intento++; drawQ(); }

function drawQ() {
  const Q = CONFIG.quiz;
  if (qi >= Q.length) return finishQuiz();
  const q = Q[qi];
  qOpen('<p class="who">' + esc(persona.nombre) + ' · ' + esc(persona.sede) + '</p><div class="qnum">PREGUNTA ' + (qi + 1) + ' DE ' + Q.length + '</div><p class="qtext">' + esc(q.q) + '</p><div class="opts">' +
    q.o.map((o, k) => '<button class="opt" type="button" data-k="' + k + '"><b>' + 'ABCD'[k] + '</b>' + esc(o) + '</button>').join('') + '</div><div class="feedback" id="fb"></div>', 'think');
  QP.querySelectorAll('.opt').forEach((btn) => btn.addEventListener('click', () => {
    const k = +btn.dataset.k, right = k === q.c;
    if (right) score++;
    resp.push({ n: qi + 1, pregunta: q.q, elegida: 'ABCD'[k] + '. ' + q.o[k], correcta: right });
    QP.querySelectorAll('.opt').forEach((b2) => { b2.disabled = true; const kk = +b2.dataset.k; if (kk === q.c) b2.classList.add('ok'); else if (kk === k) b2.classList.add('bad'); });
    QP.querySelector('.qmasc img').src = src(CONFIG.mascota[right ? 'thumbs' : 'doubt']);
    const fb = $('fb');
    fb.innerHTML = '<strong>' + (right ? '¡Correcto!' : 'No es correcto.') + '</strong> ' + esc(q.e) + '<div class="qact"><button class="big" type="button" id="qNext">' + (qi + 1 < Q.length ? 'Siguiente pregunta ▶' : 'Ver resultado ▶') + '</button></div>';
    $('qNext').addEventListener('click', () => { qi++; drawQ(); });
    $('qNext').focus();
  }));
}

function finishQuiz() {
  const total = CONFIG.quiz.length, pct = score / total, ok = pct >= REG.aprobacion;
  const now = new Date();
  const registro = Object.assign({ fecha: now.toISOString(), fechaLocal: now.toLocaleString('es-CO'), intento,
    puntaje: score, total, porcentaje: Math.round(pct * 100), resultado: ok ? 'Aprobado' : 'No aprobado',
    duracionSeg: Math.round((Date.now() - qStart) / 1000), respuestas: resp }, persona);
  qOpen('<p class="who">' + esc(persona.nombre) + ' · C.C. ' + esc(persona.cedula) + '</p><div class="qnum">RESULTADO</div><div class="score">' + score + '/' + total + '</div>' +
    '<p class="qtext">' + (ok ? '¡Aprobado! Estás listo para usar ARES.' : 'No aprobado. Repasa los módulos y vuelve a intentarlo.') + '</p>' +
    '<div class="status" id="sendStatus">Enviando resultados…</div>' +
    '<div class="qact"><button class="big" type="button" id="qAgain">Repetir evaluación</button><button class="big sec" type="button" id="qOther">Registrar otra persona</button><button class="big ghost" type="button" id="qHome">Volver al inicio</button></div>', ok ? 'cheer' : 'think');
  $('qAgain').addEventListener('click', startQuiz);
  $('qOther').addEventListener('click', () => { persona = null; showRegistro(); });
  $('qHome').addEventListener('click', showMenu);
  enviar(registro);
}

/* ---------- envío de resultados a la base de datos (función de Vercel) ---------- */
const pendientes = () => { try { return JSON.parse(localStorage.getItem(PKEY) || '[]'); } catch (e) { return []; } };
const guardarPend = (l) => { try { localStorage.setItem(PKEY, JSON.stringify(l)); } catch (e) {} };
async function post(reg) {
  const r = await fetch(REG.url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(reg) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok || !j.ok) { const err = new Error(j.error || ('Error ' + r.status)); err.status = r.status; throw err; }
  return j;
}
function setStatus(cls, txt) { const s = $('sendStatus'); if (s) { s.className = 'status ' + cls; s.textContent = txt; } }
async function enviar(reg) {
  if (!REG.url) { setStatus('bad', 'El envío de resultados no está configurado (CONFIG.registro.url).'); return; }
  try { await post(reg); setStatus('ok', 'Resultados guardados correctamente.'); flushPend(); }
  catch (e) {
    if (e.status === 400) { setStatus('bad', 'No se pudo guardar: ' + e.message + '.'); return; }
    const l = pendientes(); l.push(reg); guardarPend(l);
    setStatus('bad', 'No se pudo enviar en este momento. El resultado quedó guardado en este equipo y se enviará solo la próxima vez que se abra la capacitación con internet.');
  }
}
async function flushPend() {
  if (!REG.url) return;
  const l = pendientes(); if (!l.length) return;
  const rest = [];
  for (const r of l) { try { await post(r); } catch (e) { if (e.status !== 400) rest.push(r); } }
  guardarPend(rest);
}
flushPend();

/* ---------- controles ---------- */
$('bPlay').addEventListener('click', () => { if (view === 'menu') return go(0, true); playing ? pause() : play(); });
$('bNext').addEventListener('click', () => { if (view === 'menu') return go(0, true); if (idx < B.length - 1) go(idx + 1, true); else showQuiz(); });
$('bPrev').addEventListener('click', () => { if (idx > 0) go(idx - 1, true); });
$('bAgain').addEventListener('click', () => { if (view === 'block') go(idx, true); });
$('bHome').addEventListener('click', showMenu);
$('bQuiz').addEventListener('click', showQuiz);
document.addEventListener('keydown', (e) => { if (view === 'quiz' || e.target.closest('input,select,textarea,button.opt')) return; if (e.key === ' ' && view === 'block') { e.preventDefault(); playing ? pause() : play(); } if (e.key === 'ArrowRight') $('bNext').click(); if (e.key === 'ArrowLeft') $('bPrev').click(); });

/* ---------- modo medir (#medir): clic en una captura muestra coordenadas para CONFIG.pantallas ---------- */
if (location.hash === '#medir') {
  let pts = [];
  const tip = H('<div style="position:fixed;left:16px;bottom:16px;z-index:20;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font:14px ui-monospace,monospace;max-width:90%">Modo medir: pause el bloque y haga clic en la esquina superior izquierda y luego en la inferior derecha de un campo.</div>');
  document.body.append(tip);
  stage.addEventListener('click', (e) => {
    const img = e.target.closest('.medible') && e.target.closest('.medible').querySelector('img');
    if (!img || e.target.tagName !== 'IMG') return;
    pause();
    const x = Math.round(e.offsetX / img.offsetWidth * img.naturalWidth), y = Math.round(e.offsetY / img.offsetHeight * img.naturalHeight);
    pts.push([x, y]);
    if (pts.length === 2) { const z = [Math.min(pts[0][1], pts[1][1]), Math.max(pts[0][1], pts[1][1]), Math.min(pts[0][0], pts[1][0]), Math.max(pts[0][0], pts[1][0])]; tip.textContent = 'zona: [' + z.join(',') + ']   (imagen de ' + img.naturalWidth + 'x' + img.naturalHeight + ')'; pts = []; }
    else tip.textContent = 'Punto 1: x=' + x + ' y=' + y + '. Ahora haga clic en la esquina inferior derecha.';
  });
}

/* ---------- celular: aviso para girar y pantalla completa ---------- */
const rot = $('rotate'), mqPort = matchMedia('(orientation: portrait) and (max-width: 760px)');
let rotDismissed = false;
$('rotImg').src = src(CONFIG.mascota.point);
const canFull = !!(document.documentElement.requestFullscreen && document.fullscreenEnabled);
async function goFull() {
  try { await document.documentElement.requestFullscreen(); } catch (e) { return; }
  try { await screen.orientation.lock('landscape'); } catch (e) {}
}
if (canFull) { $('rFull').hidden = false; $('bFull2').hidden = false; }
function updRotate() { rot.hidden = !(mqPort.matches && view !== 'quiz' && !rotDismissed && !document.fullscreenElement); }
$('rFull').addEventListener('click', async () => { await goFull(); updRotate(); });
$('bFull2').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else goFull(); });
$('rStay').addEventListener('click', () => { rotDismissed = true; updRotate(); });
$('bHome2').addEventListener('click', showMenu);
(mqPort.addEventListener ? mqPort.addEventListener('change', updRotate) : mqPort.addListener(updRotate));
document.addEventListener('fullscreenchange', updRotate);
setInterval(updRotate, 600); // también refleja los cambios de vista (capacitación / evaluación)

showMenu();
requestAnimationFrame(render);
})();
</script>
